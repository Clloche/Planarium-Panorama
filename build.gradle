plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.42-beta'
}

// Version de developpement (se termine par -dev) : on ajoute le commit au nom du jar pour savoir lequel on teste.
def devSuffix = ''
if (project.mod_version.endsWith('-dev')) {
    def sha = System.getenv('GITHUB_SHA')
    if (sha == null) {
        try {
            sha = 'git rev-parse HEAD'.execute([], projectDir).text.trim()
        } catch (Exception ignored) {
            sha = null
        }
    }
    if (sha != null && sha.length() >= 7) {
        devSuffix = '+' + sha.substring(0, 7)
    }
}
version = project.mod_version + devSuffix
group = 'com.matthieu.planariumview'

base {
    archivesName = "planariumpanorama-${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    mods {
        planariumview {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        // Deuxieme joueur, dans son propre dossier (autres options et sauvegardes).
        client2 {
            client()
            gameDirectory = project.file('run-client2')
            programArguments.addAll('--username', 'Testeur2')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument('--nogui')
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Le jar d'Ars Nouveau (meme version que dans le modpack) va dans le dossier libs/
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('checkSubLevels', JavaExec) {
    group = 'verification'
    description = 'Checks sub-level coordinate precision and the optional scene network protocol.'
    onlyIf { file('src/test/java/com/matthieu/planariumview/SubLevelChecks.java').exists() }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.matthieu.planariumview.SubLevelChecks'
    workingDir = layout.buildDirectory.dir('sublevel-checks').get().asFile
    doFirst { workingDir.mkdirs() }
    dependsOn tasks.named('testClasses')
}

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath + sourceSets.main.runtimeClasspath
}

tasks.named('check') {
    dependsOn tasks.named('checkSubLevels')
}

// La version affichee dans la liste des mods vient de gradle.properties (mod_version).
tasks.named('processResources', ProcessResources).configure {
    def props = [mod_version: project.version.toString()]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
