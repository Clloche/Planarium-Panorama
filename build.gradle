plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.42-beta'
}

// Version de developpement (se termine par -dev) : on ajoute le commit au nom du jar pour savoir lequel on teste.
def devSuffix = ''
if (project.mod_version.endsWith('-dev')) {
    def sha = System.getenv('GITHUB_SHA')
    if (sha == null) {
        try {
            sha = 'git rev-parse HEAD'.execute([], projectDir).text.trim()
        } catch (Exception ignored) {
            sha = null
        }
    }
    if (sha != null && sha.length() >= 7) {
        devSuffix = '+' + sha.substring(0, 7)
    }
}
version = project.mod_version + devSuffix
group = 'com.matthieu.planariumview'

base {
    archivesName = "planariumpanorama-${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    mods {
        planariumview {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        // Deuxieme joueur, dans son propre dossier (autres options et sauvegardes).
        client2 {
            client()
            gameDirectory = project.file('run-client2')
            programArguments.addAll('--username', 'Testeur2')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument('--nogui')
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Le jar d'Ars Nouveau (meme version que dans le modpack) va dans le dossier libs/
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('checkSubLevels', JavaExec) {
    group = 'verification'
    description = 'Checks sub-level coordinate precision and the optional scene network protocol.'
    onlyIf { file('src/test/java/com/matthieu/planariumview/SubLevelChecks.java').exists() }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.matthieu.planariumview.SubLevelChecks'
    workingDir = layout.buildDirectory.dir('sublevel-checks').get().asFile
    doFirst { workingDir.mkdirs() }
    dependsOn tasks.named('testClasses')
}

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath + sourceSets.main.runtimeClasspath
}

// Self-contained, tracked checks; local diagnostics under src/test are optional and ignored by Git.
sourceSets {
    animationChecks {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    }
}

tasks.register('checkOutsideMobAnimations', JavaExec) {
    group = 'verification'
    description = 'Checks outside-mob event delivery, wire format and visual timelines.'
    dependsOn tasks.named('animationChecksClasses')
    classpath = sourceSets.animationChecks.runtimeClasspath
    mainClass = 'com.matthieu.planariumview.MobAnimationChecks'
    workingDir = layout.buildDirectory.dir('mob-animation-checks').get().asFile
    doFirst { workingDir.mkdirs() }
}

tasks.register('mobAnimationFixtureAgent', Jar) {
    dependsOn tasks.named('animationChecksClasses')
    from(sourceSets.animationChecks.output) { include 'com/matthieu/planariumview/AnimationFixtureAgent*.class' }
    archiveFileName = 'mob-animation-fixtures.jar'
    destinationDirectory = layout.buildDirectory.dir('mob-animation-checks')
    manifest { attributes 'Premain-Class': 'com.matthieu.planariumview.AnimationFixtureAgent' }
}

tasks.register('checkOutsideMobIntegration', JavaExec) {
    group = 'verification'
    description = 'Checks production mob capture and playback with isolated world fixtures.'
    dependsOn tasks.named('mobAnimationFixtureAgent')
    classpath = sourceSets.animationChecks.runtimeClasspath
    mainClass = 'com.matthieu.planariumview.MobAnimationIntegrationChecks'
    workingDir = layout.buildDirectory.dir('mob-animation-checks').get().asFile
    doFirst { jvmArgs '-javaagent:' + tasks.named('mobAnimationFixtureAgent').get().archiveFile.get().asFile.absolutePath }
}

tasks.register('checkMiniatureLive', JavaExec) {
    group = 'verification'
    description = 'Checks live miniature packets, snapshots, interpolation, options and chunk tickets.'
    dependsOn tasks.named('mobAnimationFixtureAgent')
    classpath = sourceSets.animationChecks.runtimeClasspath
    mainClass = 'com.matthieu.planariumview.server.MiniatureLiveChecks'
    workingDir = layout.buildDirectory.dir('miniature-live-checks').get().asFile
    doFirst {
        workingDir.mkdirs()
        jvmArgs '-javaagent:' + tasks.named('mobAnimationFixtureAgent').get().archiveFile.get().asFile.absolutePath + '=miniatures'
    }
}

tasks.register('checkMiniatureSpellScope', JavaExec) {
    group = 'verification'
    description = 'Checks the vanilla spell particle constructor with the production scope mixin applied.'
    dependsOn tasks.named('mobAnimationFixtureAgent')
    classpath = sourceSets.animationChecks.runtimeClasspath
    mainClass = 'com.matthieu.planariumview.SpellScopeMixinChecks'
    workingDir = layout.buildDirectory.dir('spell-scope-checks').get().asFile
    doFirst {
        workingDir.mkdirs()
        jvmArgs '-javaagent:' + tasks.named('mobAnimationFixtureAgent').get().archiveFile.get().asFile.absolutePath + '=spell-scope'
    }
}

tasks.register('checkParticleLightCache', JavaExec) {
    group = 'verification'
    description = 'Checks the production particle light mixin cache across frames, ticks and world clears.'
    dependsOn tasks.named('mobAnimationFixtureAgent')
    classpath = sourceSets.animationChecks.runtimeClasspath
    mainClass = 'com.matthieu.planariumview.ParticleLightCacheChecks'
    workingDir = layout.buildDirectory.dir('particle-light-checks').get().asFile
    doFirst {
        workingDir.mkdirs()
        jvmArgs '-javaagent:' + tasks.named('mobAnimationFixtureAgent').get().archiveFile.get().asFile.absolutePath + '=spell-scope'
    }
}

tasks.register('checkFlightShaderBatch', JavaExec) {
    group = 'verification'
    description = 'Checks flight shader batching, clipped fallback and render-state cleanup without OpenGL.'
    dependsOn tasks.named('mobAnimationFixtureAgent')
    classpath = sourceSets.animationChecks.runtimeClasspath
    mainClass = 'com.matthieu.planariumview.client.scenery.FlightShaderBatchChecks'
    workingDir = layout.buildDirectory.dir('flight-shader-checks').get().asFile
    doFirst {
        workingDir.mkdirs()
        jvmArgs '-javaagent:' + tasks.named('mobAnimationFixtureAgent').get().archiveFile.get().asFile.absolutePath + '=flight-batch'
    }
}

tasks.register('checkSceneryOcclusion', JavaExec) {
    group = 'verification'
    description = 'Checks conservative scenery mob occlusion, transforms and cached visibility.'
    dependsOn tasks.named('animationChecksClasses')
    classpath = sourceSets.animationChecks.runtimeClasspath
    mainClass = 'com.matthieu.planariumview.client.scenery.SceneryOcclusionChecks'
    workingDir = layout.buildDirectory.dir('scenery-occlusion-checks').get().asFile
    doFirst { workingDir.mkdirs() }
}

tasks.named('check') {
    dependsOn tasks.named('checkSubLevels')
    dependsOn tasks.named('checkOutsideMobAnimations')
    dependsOn tasks.named('checkOutsideMobIntegration')
    dependsOn tasks.named('checkMiniatureLive')
    dependsOn tasks.named('checkMiniatureSpellScope')
    dependsOn tasks.named('checkParticleLightCache')
    dependsOn tasks.named('checkFlightShaderBatch')
    dependsOn tasks.named('checkSceneryOcclusion')
}

// La version affichee dans la liste des mods vient de gradle.properties (mod_version).
tasks.named('processResources', ProcessResources).configure {
    def props = [mod_version: project.version.toString()]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
